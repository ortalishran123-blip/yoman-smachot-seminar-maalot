<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5RJ88LZH');</script>
    <!-- End Google Tag Manager -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן שמחות סמינר מעלות</title>
    <link rel="stylesheet" href="style.css?v=12.0">
    <!-- PapaParse לקריאת קבצי CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5RJ88LZH"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="main-layout">

        <!-- סיידבר ימני: אירועים שהיו לאחרונה -->
        <aside class="sidebar sidebar-right">
            <div class="sidebar-header">
                <h2>📜 מזל טוב! (אירועים שהיו)</h2>
            </div>
            <div id="past-events-ticker" class="ticker-container">
                <!-- כאן יופיעו האירועים שהיו -->
            </div>
        </aside>

        <!-- אזור מרכזי: שמחות עתידיות -->
        <main class="content-center">
            <header class="page-header">
                <button class="theme-toggle-btn" onclick="toggleDarkMode()">🌙 מצב כהה / אור</button>
                <h1>יומן שמחות סמינר מעלות</h1>
                <p class="subtitle">מאגר השמחות המרכזי והעדכני</p>
                <button class="btn-add-event" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSf-TX5InPNbEoZrM4sDcTJN20k9Ku8YcA-AjAXvMHWSdNkWkg/viewform', '_blank')">
                    ✨ הוספת שמחה חדשה
                </button>
            </header>

            <!-- סרגל חיפוש וסינון -->
            <section class="filter-section">
                <div class="search-box" style="position: relative;">
                    <input type="text" id="search-input" placeholder="חיפוש לפי כלה, כיתה, מסלול, אולם...">
                    <button id="clear-search" class="clear-search-btn" onclick="clearSearch()" style="display: none;">✕</button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">הכל</button>
                    <button class="filter-btn" data-filter="wedding">חתונות</button>
                    <button class="filter-btn" data-filter="engagement">אירוסין</button>
                </div>
            </section>

            <!-- רשימת האירועים העתידיים -->
            <section id="events-list" class="events-grid">
                <!-- כאן יטענו האירועים מהקוד -->
            </section>

            <!-- אודות / מידע תחתון -->
            <section class="about-section">
                <h2>אודות היומן</h2>
                <p>ברוכים הבאים למאגר השמחות והעדכונים. המערכת נועדה לשתף אתכם כל שמחה של חברי וחברות צוות או בוגרות הסמינר בשעה טובה.</p>
            </section>
        </main>

        <!-- סיידבר שמאלי: עדכונים מיוחדים -->
        <aside class="sidebar sidebar-left">
            <div class="sidebar-header">
                <h2>📢 אירועים / עדכונים מיוחדים</h2>
                <button class="btn-add-update" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSdkYAUSIoFMBtpxSyiMzAp8fSZlY2LQLbHHLHKDy1A2v_PinA/viewform?usp=dialog', '_blank')">
                    + הוספת עדכון
                </button>
            </div>
            <div id="updates-ticker" class="ticker-container">
                <!-- כאן יופיעו העדכונים -->
            </div>
        </aside>

    </div>

    <script src="script.js?v=12.0"></script>
</body>
</html>
