<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>יומן שמחות סמינר מעלות</title>
    <link rel="stylesheet" href="style.css?v=11.0">
    <!-- PapaParse לטעינת קובצי CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

    <div class="main-layout">

        <!-- סרגל צד ימין: אירועים שהיו לאחרונה -->
        <aside class="sidebar sidebar-right">
            <div class="sidebar-header">
                <h2>📜 מזל טוב! (אירועים שהיו)</h2>
            </div>
            <div id="past-events-ticker" class="ticker-container">
                <!-- יוטען דינמית באמצעות JS -->
            </div>
        </aside>

        <!-- אזור מרכזי: שמחות עתידיות -->
        <main class="content-center">
            <header class="page-header">
                <h1>יומן שמחות סמינר מעלות</h1>
                <p class="subtitle">מאגר השמחות המרכזי והעדכני</p>
                <button class="btn-add-event" onclick="window.open('YOUR_GOOGLE_FORM_URL', '_blank')">
                    ✨ הוספת שמחה חדשה
                </button>
            </header>

            <!-- סרגל חיפוש וסינון -->
            <section class="filter-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="חיפוש לפי כלה, כיתה, מסלול, אולם...">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">הכל</button>
                    <button class="filter-btn" data-filter="wedding">חתונות</button>
                    <button class="filter-btn" data-filter="engagement">אירוסין</button>
                </div>
            </section>

            <!-- רשימת האירועים העתידיים -->
            <section id="events-list" class="events-grid">
                <!-- יוטען דינמית באמצעות JS -->
            </section>

            <!-- אזור מידע תחתון -->
            <section class="about-section">
                <h2>אודות יומן השמחות</h2>
                <p>
                    ברוכים הבאים לפורטל השמחות והאירועים. המערכת נועדה לרכז עבורכן את כל המידע העדכני ביותר לגבי מועדי אירוסין, חתונות ואירועים משמחים.
                </p>
            </section>
        </main>

        <!-- סרגל צד שמאל: עדכונים מיוחדים -->
        <aside class="sidebar sidebar-left">
            <div class="sidebar-header">
                <h2>📢 אירועים / עדכונים מיוחדים</h2>
                <button class="btn-add-update" onclick="window.open('YOUR_UPDATE_FORM_URL', '_blank')">
                    + הוספת עדכון
                </button>
            </div>
            <div id="updates-ticker" class="ticker-container">
                <!-- יוטען דינמית באמצעות JS -->
            </div>
        </aside>

    </div>

    <script src="script.js?v=11.0"></script>
</body>
</html>
